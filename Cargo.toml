[package]
name = "my-markdown-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
url = "2.5"
notify = "=8.2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[features]
ui-tests = ["gpui-kit/test-support"]

[profile.dev]
debug = "limited"
