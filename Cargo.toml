[package]
name = "my-markdown-viewer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mmv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
url = "2.5"
notify = "=8.2.1"
mlua = { version = "=0.12.2", features = ["lua54", "vendored"] }
nucleo-matcher = "=0.3.1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
ui-tests = ["gpui-kit/test-support"]

[build-dependencies]
embed-resource = "=3.0.12"

# Immutable fork revision providing strict source-line reveal.
[patch.crates-io]
gpui-base = { git = "https://github.com/P4ND4XYZ/gpui-kit.git", rev = "1a2539f67f4dbceecb1885c02abd272dbda06e33" }

[profile.dev]
debug = "limited"
